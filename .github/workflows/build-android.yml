name: Build HaxMantega Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Juntar inject.js e mobile.js
        run: |
          mkdir -p android/app/src/main/assets
          cat inject.js > android/app/src/main/assets/inject.js
          printf '\n;\n' >> android/app/src/main/assets/inject.js
          cat mobile.js >> android/app/src/main/assets/inject.js

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HaxMantega-android
          path: android/app/build/outputs/apk/debug/*.apk
